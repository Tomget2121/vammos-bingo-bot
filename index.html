<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vammos Bingo</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
  text-align: center;
}

h1 { margin: 18px 0 5px; }

.info {
  font-size: 18px;
  margin-bottom: 10px;
}

.called {
  font-size: 30px;
  font-weight: bold;
  margin: 15px;
  min-height: 40px;
}

.board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  max-width: 360px;
  margin: 10px auto 20px;
  padding: 8px;
}

.header {
  background: #f59e0b;
  color: #111;
  font-weight: bold;
  padding: 10px 0;
  border-radius: 6px;
}

.cell {
  background: white;
  color: #111;
  padding: 16px 3px;
  border-radius: 7px;
  font-size: 18px;
  font-weight: bold;
}

.cell.marked {
  background: #22c55e;
  color: white;
}

.free {
  background: #facc15;
}

button {
  padding: 14px 20px;
  margin: 5px;
  font-size: 17px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
}

#callBtn {
  background: #ef4444;
  color: white;
}

#newBtn {
  background: #3b82f6;
  color: white;
}

#startBtn {
  background: #22c55e;
  color: white;
}

#stopBtn {
  background: #f97316;
  color: white;
}
</style>
</head>

<body>

<h1>🎱 VAMMOS BINGO</h1>

<div class="info">Entry: 20 ETB</div>

<div class="called" id="called">Ready</div>

<div class="board" id="board"></div>

<button id="callBtn" onclick="callNumber()">CALL NUMBER</button>
<button id="newBtn" onclick="newGame()">NEW GAME</button>
<button id="startBtn" onclick="startAutoCall()">START AUTO CALL</button>
<button id="stopBtn" onclick="stopAutoCall()">STOP</button>

<script>

let board = document.getElementById("board");
let called = document.getElementById("called");

let calledNumbers = [];
let autoCallTimer = null;

function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createColumn(min, max) {
  let result = [];

  while (result.length < 5) {
    let n = randomNumber(min, max);

    if (!result.includes(n)) {
      result.push(n);
    }
  }

  return result;
}

function createBoard() {

  board.innerHTML = "";

  let columns = [
    createColumn(1, 15),
    createColumn(16, 30),
    createColumn(31, 45),
    createColumn(46, 60),
    createColumn(61, 75)
  ];

  let letters = ["B", "I", "N", "G", "O"];

  for (let c = 0; c < 5; c++) {
    let header = document.createElement("div");
    header.className = "header";
    header.innerText = letters[c];
    board.appendChild(header);
  }

  for (let row = 0; row < 5; row++) {

    for (let col = 0; col < 5; col++) {

      let cell = document.createElement("div");
      cell.className = "cell";

      if (row === 2 && col === 2) {

        cell.className += " free";
        cell.innerText = "FREE";

      } else {

        cell.innerText = columns[col][row];

        cell.onclick = function() {

          let n = Number(cell.innerText);

          if (calledNumbers.includes(n)) {
            cell.classList.toggle("marked");
          }

        };
      }

      board.appendChild(cell);
    }
  }
}

function callNumber() {

  let available = [];

  for (let i = 1; i <= 75; i++) {
    if (!calledNumbers.includes(i)) {
      available.push(i);
    }
  }

  if (available.length === 0) {
    called.innerText = "ALL NUMBERS CALLED!";
    stopAutoCall();
    return;
  }

  let number = available[randomNumber(0, available.length - 1)];

  calledNumbers.push(number);

  let letter;

  if (number <= 15) {
    letter = "B";
  } else if (number <= 30) {
    letter = "I";
  } else if (number <= 45) {
    letter = "N";
  } else if (number <= 60) {
    letter = "G";
  } else {
    letter = "O";
  }

  called.innerText = letter + " - " + number;

  highlightCalledNumber(number);
}

function highlightCalledNumber(number) {function checkBingo() {

  let cells = document.querySelectorAll(".cell");

  let marked = [];

  cells.forEach(function(cell) {
    if (cell.classList.contains("marked")) {
      marked.push(cell);
    }
  });

  if (marked.length >= 5) {
    called.innerText = "🎉 BINGO! 🎉";
    stopAutoCall();
checkBingo();  }
}

  let cells = document.querySelectorAll(".cell");

  cells.forEach(function(cell) {

    if (Number(cell.innerText) === number) {
      cell.classList.add("marked");
    }

  });
}

function startAutoCall() {

  stopAutoCall();

  callNumber();

  autoCallTimer = setInterval(function() {
    callNumber();
  }, 5000);
}

function stopAutoCall() {

  if (autoCallTimer !== null) {
    clearInterval(autoCallTimer);
    autoCallTimer = null;
  }
}

function newGame() {

  stopAutoCall();

  calledNumbers = [];

  called.innerText = "Ready";

  createBoard();
}

createBoard();

</script>

</body>
</html>
